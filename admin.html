<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Class App</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f8fafc}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px}.btn{border-radius:10px;padding:10px 14px;font-weight:700;background:#0f766e;color:#fff}</style></head><body class="text-slate-800"><main class="max-w-3xl mx-auto p-4"><header class="mb-6"><p class="text-xs font-bold text-teal-700">ADMIN PAGE</p><h1 class="text-2xl font-extrabold">Class Management</h1><p class="text-sm text-slate-500">Build mode — login ഇല്ല</p></header><div id="notice" class="hidden mb-3 p-3 rounded bg-teal-100 text-teal-900 text-sm"></div><section class="card mb-4"><h2 class="font-bold">പുതിയ Class ചേർക്കുക</h2><div class="grid sm:grid-cols-2 gap-2 mt-3"><input id="class-name" class="field" placeholder="ഉദാ: Class 5 A"><input id="class-subjects" class="field" placeholder="Subjects: Quran, Fiqh"></div><button id="save-class" class="btn mt-3">Class Save</button></section><section class="card mb-4"><h2 class="font-bold">വിദ്യാർത്ഥിയെ ചേർക്കുക</h2><div class="grid sm:grid-cols-2 gap-2 mt-3"><input id="student-name" class="field" placeholder="വിദ്യാർത്ഥിയുടെ പേര്"><input id="student-roll" class="field" placeholder="Roll നമ്പർ"><select id="student-class" class="field"></select><input id="guardian" class="field" placeholder="Parent / Guardian"></div><button id="save-student" class="btn mt-3">Student Save</button></section><section class="card mb-4"><h2 class="font-bold">Announcement</h2><input id="announcement-title" class="field mt-3" placeholder="Title"><textarea id="announcement-body" class="field mt-2" placeholder="Message"></textarea><button id="save-announcement" class="btn mt-3">Publish</button></section><section class="card"><h2 class="font-bold mb-3">Classes & Students</h2><div id="lists">Loading…</div></section><p class="text-xs text-slate-400 mt-5">Teacher page: <b>teacher.html</b> · Student page: <b>student.html</b></p></main><script type="module">import{db}from'./firebase-config.js';import{collection,addDoc,getDocs,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';const $=x=>document.getElementById(x),say=x=>{let n=$('notice');n.textContent=x;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3000)},esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let classes=[];async function load(){let c=await getDocs(collection(db,'classes'));classes=c.docs.map(x=>({id:x.id,...x.data()}));$('student-class').innerHTML='<option value="">Class തിരഞ്ഞെടുക്കുക</option>'+classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');let s=await getDocs(collection(db,'students'));$('lists').innerHTML=classes.map(c=>`<div class="border-t pt-3 mt-3"><b>${esc(c.name)}</b><p class="text-xs text-slate-500">${esc((c.subjects||[]).join(', '))}</p><ul class="text-sm mt-2">${s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.classId===c.id).map(x=>`<li>${esc(x.rollNo)}. ${esc(x.name)}</li>`).join('')||'<li>No students</li>'}</ul></div>`).join('')||'No classes yet.'}$('save-class').onclick=async()=>{let name=$('class-name').value.trim();if(!name)return say('Class name നൽകുക');await addDoc(collection(db,'classes'),{name,subjects:$('class-subjects').value.split(',').map(x=>x.trim()).filter(Boolean),createdAt:serverTimestamp()});$('class-name').value='';$('class-subjects').value='';say('Class saved');load()};$('save-student').onclick=async()=>{let name=$('student-name').value.trim(),classId=$('student-class').value;if(!name||!classId)return say('Name, class നൽകുക');await addDoc(collection(db,'students'),{name,classId,rollNo:$('student-roll').value.trim(),guardian:$('guardian').value.trim(),createdAt:serverTimestamp()});say('Student saved');load()};$('save-announcement').onclick=async()=>{let title=$('announcement-title').value.trim(),body=$('announcement-body').value.trim();if(!title)return say('Title നൽകുക');await addDoc(collection(db,'announcements'),{title,body,createdAt:serverTimestamp()});$('announcement-title').value='';$('announcement-body').value='';say('Announcement published')};load();</script></body></html>
