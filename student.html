<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student — Class App</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f8fafc}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px}.btn{border-radius:10px;padding:10px 14px;font-weight:700;background:#7c3aed;color:#fff}</style></head><body class="text-slate-800"><main class="max-w-3xl mx-auto p-4"><header class="mb-6"><p class="text-xs font-bold text-violet-700">STUDENT PAGE</p><h1 class="text-2xl font-extrabold">My Class Progress</h1><p class="text-sm text-slate-500">Build mode — login ഇല്ല</p></header><section class="card"><label class="text-sm font-bold">നിങ്ങളുടെ പേര് തിരഞ്ഞെടുക്കുക</label><select id="student" class="field mt-2"></select><button id="show" class="btn mt-3">My Report കാണുക</button></section><section id="report" class="mt-4"></section><section class="card mt-4"><h2 class="font-bold">Announcements</h2><div id="announcements" class="mt-3 text-sm"></div></section><p class="text-xs text-slate-400 mt-5">Admin page: <b>admin.html</b> · Teacher page: <b>teacher.html</b></p></main><script type="module">import{db}from'./firebase-config.js';import{collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let students=[];async function init(){let q=await getDocs(collection(db,'students'));students=q.docs.map(x=>({id:x.id,...x.data()}));$('student').innerHTML='<option value="">പേര് തിരഞ്ഞെടുക്കുക</option>'+students.map(s=>`<option value="${s.id}">${esc(s.name)}${s.rollNo?' ('+esc(s.rollNo)+')':''}</option>`).join('');let a=await getDocs(collection(db,'announcements'));$('announcements').innerHTML=a.docs.map(x=>`<article class="border-t pt-2 mt-2"><b>${esc(x.data().title)}</b><p>${esc(x.data().body)}</p></article>`).join('')||'No announcements'}$('show').onclick=async()=>{let id=$('student').value,st=students.find(x=>x.id===id);if(!st)return;let a=await getDocs(query(collection(db,'attendance'),where('classId','==',st.classId)));let total=0,p=0,ab=0,l=0;a.forEach(x=>{let r=x.data().records?.[id];if(r){total++;if(['present','late'].includes(r.status))p++;else if(r.status==='absent')ab++;else l++}});$('report').innerHTML=`<div class="grid grid-cols-2 gap-3"><div class="card"><p class="text-xs text-slate-500">Attendance</p><p class="text-3xl font-extrabold">${total?Math.round(p/total*100):0}%</p></div><div class="card"><p class="text-xs text-slate-500">Recorded days</p><p class="text-3xl font-extrabold">${total}</p></div><div class="card">Present: <b>${p}</b></div><div class="card">Absent: <b>${ab}</b> · Leave: <b>${l}</b></div></div>`};init();</script></body></html>
