<!doctype html>
<html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Noorun Ala Noor - Student Portal</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Poppins,sans-serif;background:#f8fafc}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem;box-shadow:0 1px 3px #0f172a12}.nav{padding:.7rem .8rem;border-radius:.75rem;font-size:.85rem;font-weight:600;color:#475569}.nav.active{background:#ede9fe;color:#6d28d9}.stat{border-radius:1rem;padding:1rem;text-align:center}</style></head><body class="text-slate-800"><div class="bg-amber-100 text-amber-900 text-center text-xs font-bold py-2">BUILD MODE — Login/security പിന്നീട് ചേർക്കും</div><header class="bg-white sticky top-0 z-20 border-b"><div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center"><div><h1 id="title" class="font-bold">NOORUN ALA NOOR</h1><p class="text-[10px] text-slate-500 font-semibold">STUDENT PORTAL</p></div><button id="menu" class="p-2 rounded-lg bg-slate-100"><i class="fas fa-bars"></i></button></div></header><main class="max-w-md mx-auto p-4 pb-24"><section id="choose" class="card"><h2 class="font-bold">എന്റെ Profile തിരഞ്ഞെടുക്കുക</h2><p class="text-xs text-slate-500 mt-1">Build mode-ൽ വിദ്യാർത്ഥിയുടെ പേര് തിരഞ്ഞെടുക്കുക.</p><select id="student" class="w-full border rounded-xl px-3 py-3 mt-3"></select><button id="open" class="w-full bg-violet-600 text-white font-bold rounded-xl py-3 mt-3">Open My Dashboard</button></section><section id="app" class="hidden"><nav id="nav" class="flex gap-1 overflow-x-auto bg-white rounded-xl p-1 shadow-sm mb-4"><button class="nav active" data-view="home">Home</button><button class="nav" data-view="attendance">Attendance</button><button class="nav" data-view="progress">Progress</button><button class="nav" data-view="notices">Notices</button></nav><div id="home" class="view active"></div><div id="attendance" class="view"></div><div id="progress" class="view"></div><div id="notices" class="view"></div></section></main><script type="module">import{db}from'./firebase-config.js';import{collection,doc,getDoc,getDocs,query,where}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ref=n=>collection(db,'madrasa','public','data',n),d=(n,id)=>doc(db,'madrasa','public','data',n,id);let state={config:{classes:[]},students:[],student:null,cls:null};async function init(){let g=await getDoc(d('config','global'));state.config=g.exists()?g.data():{classes:[]};$('title').textContent=state.config.instName||'NOORUN ALA NOOR';let s=await getDocs(ref('students'));state.students=s.docs.map(x=>({id:x.id,...x.data()}));$('student').innerHTML='<option value="">-- പേര് തിരഞ്ഞെടുക്കുക --</option>'+state.students.map(x=>`<option value="${x.id}">${esc(x.name)}${x.rollNo?' · '+esc(x.rollNo):''}</option>`).join('')}$('open').onclick=()=>{let id=$('student').value;state.student=state.students.find(x=>x.id===id);if(!state.student)return;state.cls=(state.config.classes||[]).find(x=>x.id===state.student.classId);$('choose').classList.add('hidden');$('app').classList.remove('hidden');renderHome()};$('nav').onclick=e=>{let b=e.target.closest('[data-view]');if(!b)return;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(b.dataset.view).classList.add('active');({home:renderHome,attendance:renderAttendance,progress:renderProgress,notices:renderNotices})[b.dataset.view]()};async function renderHome(){let day=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()],t=await getDoc(d('config','timetable_'+state.cls.id)),periods=t.exists()?(t.data()[day]||[]):[];$('home').innerHTML=`<h2 class="text-xl font-bold">Assalamu Alaikum, ${esc(state.student.name)}</h2><p class="text-sm text-slate-500 mb-4">${esc(state.cls?.name||'Class')}</p><div class="card"><h3 class="font-bold"><i class="fas fa-calendar-day text-blue-500 mr-2"></i>Today's Classes</h3><div class="mt-3 space-y-2">${periods.filter(x=>x.subject).map((x,i)=>`<div class="flex justify-between bg-slate-50 rounded-lg p-3"><b>${i+1}. ${esc(x.subject)}</b><span class="text-xs text-slate-500">${esc(x.start)} - ${esc(x.end)}</span></div>`).join('')||'<p class="text-sm text-slate-400">No classes today.</p>'}</div></div><div class="grid grid-cols-2 gap-3 mt-3"><button class="card text-left" data-jump="attendance"><i class="fas fa-user-check text-emerald-500"></i><b class="block mt-2">My Attendance</b></button><button class="card text-left" data-jump="progress"><i class="fas fa-chart-line text-violet-500"></i><b class="block mt-2">My Progress</b></button></div>`;document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>document.querySelector(`[data-view="${x.dataset.jump}"]`).click())}async function renderAttendance(){let q=await getDocs(ref('attendance')),p=0,a=0,l=0,rows=[];q.forEach(x=>{let r=x.data();let v=r.records?.[state.student.id];if(v){rows.push({date:r.date,...v});if(v.status==='present')p++;else if(v.status==='absent')a++;else l++}});rows.sort((x,y)=>y.date.localeCompare(x.date));let total=p+a+l;$('attendance').innerHTML=`<h2 class="text-xl font-bold mb-3">My Attendance</h2><div class="grid grid-cols-3 gap-2"><div class="stat bg-emerald-50 text-emerald-700"><b class="text-2xl">${p}</b><small class="block">Present</small></div><div class="stat bg-red-50 text-red-700"><b class="text-2xl">${a}</b><small class="block">Absent</small></div><div class="stat bg-amber-50 text-amber-700"><b class="text-2xl">${l}</b><small class="block">Leave</small></div></div><div class="card mt-3"><p class="font-bold">Attendance percentage: ${total?Math.round(p/total*100):0}%</p><div class="mt-3 space-y-2">${rows.map(x=>`<div class="flex justify-between text-sm border-b pb-2"><span>${esc(x.date)}</span><b class="capitalize">${esc(x.status)}</b></div>`).join('')||'<p class="text-sm text-slate-400">No attendance records.</p>'}</div></div>`}async function renderProgress(){let task=await getDocs(ref('task_evaluations')),tracking=await getDocs(ref('daily_tracking'));let points=0,asked=0;task.forEach(x=>{let r=x.data();if(r.classId===state.cls.id&&r.records?.[state.student.id])Object.entries(r.records[state.student.id]).forEach(([id,yes])=>{if(yes){/* Task titles remain configured by Admin; count completion here. */points++}})});tracking.forEach(x=>{let r=x.data();if(r.classId===state.cls.id&&r.students?.[state.student.id]==='asked')asked++});$('progress').innerHTML=`<h2 class="text-xl font-bold mb-3">My Progress</h2><div class="grid grid-cols-2 gap-3"><div class="stat bg-amber-50 text-amber-700"><b class="text-3xl">${points}</b><small class="block">Tasks completed</small></div><div class="stat bg-indigo-50 text-indigo-700"><b class="text-3xl">${asked}</b><small class="block">Q&A days</small></div></div><div class="card mt-3"><h3 class="font-bold">Syllabus</h3><p class="text-sm text-slate-500 mt-2">Teacher syllabus progress update ചെയ്താൽ ഇവിടെ class learning progress കാണിക്കും.</p><div class="mt-3">${(state.cls.subjects||[]).map(x=>`<span class="inline-block bg-violet-50 text-violet-700 rounded-full px-3 py-1 text-xs font-bold mr-1 mb-1">${esc(x)}</span>`).join('')||'No subjects configured.'}</div></div>`}async function renderNotices(){let n=[];try{let q=await getDocs(ref('announcements'));n=q.docs.map(x=>x.data())}catch(e){}$('notices').innerHTML=`<h2 class="text-xl font-bold mb-3">Notices</h2><div class="space-y-3">${n.map(x=>`<article class="card"><h3 class="font-bold">${esc(x.title)}</h3><p class="text-sm text-slate-600 mt-2">${esc(x.body)}</p></article>`).join('')||'<div class="card text-sm text-slate-400">No announcements yet.</div>'}</div>`}init();</script></body></html>
