<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student class dashboard for Noorun Ala Noor.">
  <title>Noorun Ala Noor | Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif;background:#f7f8fc}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem;box-shadow:0 1px 3px #0f172a0d}.nav{padding:.7rem .85rem;border-radius:.75rem;font-size:.85rem;font-weight:600;color:#475569;white-space:nowrap}.nav.active{background:#ede9fe;color:#6d28d9}.stat{border-radius:1rem;padding:1rem;text-align:center}</style>
</head>
<body class="text-slate-800">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-md items-center justify-between px-4 py-3"><a href="index.html" class="flex items-center gap-3"><span class="grid h-9 w-9 place-items-center rounded-xl bg-violet-600 text-xs font-bold text-white">NA</span><span><h1 id="title" class="font-bold tracking-wide">NOORUN ALA NOOR</h1><p class="text-[10px] font-semibold tracking-wider text-slate-500">STUDENT PORTAL</p></span></a><a href="index.html" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-bold text-slate-600">All portals</a></div>
  </header>
  <main class="mx-auto max-w-md p-4 pb-24">
    <section id="choose" class="card mt-4">
      <span class="grid h-11 w-11 place-items-center rounded-xl bg-violet-50 text-violet-600"><i class="fas fa-graduation-cap"></i></span>
      <h2 class="mt-4 text-xl font-bold">Open your dashboard</h2><p class="mt-1 text-sm leading-6 text-slate-500">Select your name to see your timetable, attendance, progress, and notices.</p>
      <label for="student" class="mt-5 block text-xs font-bold uppercase tracking-wide text-slate-600">Student</label><select id="student" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100"><option value="">Loading students…</option></select>
      <p id="selection-message" class="mt-2 hidden text-xs text-red-600" role="alert"></p><button id="open" class="mt-4 w-full rounded-xl bg-violet-600 py-3 font-bold text-white shadow-lg shadow-violet-200 transition hover:bg-violet-700">Open dashboard</button>
    </section>
    <section id="app" class="hidden"><div class="mt-4 flex items-center justify-between"><p id="student-label" class="text-sm font-bold text-slate-600"></p><button id="change-student" class="text-xs font-bold text-violet-700">Change student</button></div><nav id="nav" class="mt-3 flex gap-1 overflow-x-auto rounded-xl bg-white p-1 shadow-sm"><button class="nav active" data-view="home">Overview</button><button class="nav" data-view="attendance">Attendance</button><button class="nav" data-view="progress">Progress</button><button class="nav" data-view="notices">Notices</button></nav><div id="home" class="view active mt-4"></div><div id="attendance" class="view mt-4"></div><div id="progress" class="view mt-4"></div><div id="notices" class="view mt-4"></div></section>
  </main>
  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, doc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const ref = name => collection(db, 'madrasa', 'public', 'data', name);
    const documentRef = (name, id) => doc(db, 'madrasa', 'public', 'data', name, id);
    const state = { config:{classes:[]}, students:[], student:null, classInfo:null };
    const empty = message => `<div class="card text-center text-sm text-slate-500">${esc(message)}</div>`;
    function showMessage(message) { const node = $('selection-message'); node.textContent = message; node.classList.toggle('hidden', !message); }
    function selectView(name) { document.querySelectorAll('.nav').forEach(button => button.classList.toggle('active', button.dataset.view === name)); document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.id === name)); ({home:renderHome, attendance:renderAttendance, progress:renderProgress, notices:renderNotices})[name](); }
    async function init() {
      try {
        const global = await getDoc(documentRef('config', 'global'));
        state.config = global.exists() ? global.data() : {classes:[]};
        $('title').textContent = state.config.instName || 'NOORUN ALA NOOR';
        const students = await getDocs(ref('students'));
        state.students = students.docs.map(item => ({id:item.id, ...item.data()})).sort((a,b) => (a.rollNo || 0) - (b.rollNo || 0));
        $('student').innerHTML = '<option value="">Choose your name</option>' + state.students.map(student => `<option value="${esc(student.id)}">${esc(student.name)}${student.rollNo ? ` · ${esc(student.rollNo)}` : ''}</option>`).join('');
        if (!state.students.length) showMessage('No students have been added yet. Please ask an administrator to set up your class.');
      } catch (error) { console.error(error); $('student').innerHTML = '<option value="">Unable to load students</option>'; showMessage('We could not load the dashboard. Check your connection and try again.'); }
    }
    $('open').addEventListener('click', () => { const id = $('student').value; state.student = state.students.find(student => student.id === id); if (!state.student) return showMessage('Please choose your name before opening the dashboard.'); state.classInfo = (state.config.classes || []).find(item => item.id === state.student.classId); if (!state.classInfo) return showMessage('This student is not assigned to a class yet. Please contact an administrator.'); showMessage(''); $('student-label').textContent = state.student.name; $('choose').classList.add('hidden'); $('app').classList.remove('hidden'); selectView('home'); });
    $('change-student').addEventListener('click', () => { $('app').classList.add('hidden'); $('choose').classList.remove('hidden'); $('student').focus(); });
    $('nav').addEventListener('click', event => { const button = event.target.closest('[data-view]'); if (button) selectView(button.dataset.view); });
    async function renderHome() { const day = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()]; try { const timetable = await getDoc(documentRef('config', `timetable_${state.classInfo.id}`)); const periods = timetable.exists() ? (timetable.data()[day] || []) : []; $('home').innerHTML = `<h2 class="text-xl font-bold">Welcome, ${esc(state.student.name)}</h2><p class="mb-4 text-sm text-slate-500">${esc(state.classInfo.name)} · ${day}</p><div class="card"><h3 class="font-bold"><i class="fas fa-calendar-day mr-2 text-blue-500"></i>Today’s lessons</h3><div class="mt-3 space-y-2">${periods.filter(item => item.subject).map((item,index) => `<div class="flex items-center justify-between rounded-lg bg-slate-50 p-3"><b class="text-sm">${index + 1}. ${esc(item.subject)}</b><span class="text-xs text-slate-500">${esc(item.start)} – ${esc(item.end)}</span></div>`).join('') || '<p class="text-sm text-slate-400">No lessons are scheduled for today.</p>'}</div></div>`; } catch (error) { console.error(error); $('home').innerHTML = empty('Today’s timetable is unavailable right now.'); } }
    async function renderAttendance() { try { const snapshot = await getDocs(ref('attendance')); let present=0, absent=0, leave=0, rows=[]; snapshot.forEach(item => { const record = item.data(); const entry = record.records?.[state.student.id]; if (!entry) return; rows.push({date:record.date || '', ...entry}); if (entry.status === 'present') present++; else if (entry.status === 'absent') absent++; else if (entry.status === 'leave') leave++; }); rows.sort((a,b) => b.date.localeCompare(a.date)); const total = present + absent + leave; $('attendance').innerHTML = `<h2 class="mb-3 text-xl font-bold">My attendance</h2><div class="grid grid-cols-3 gap-2"><div class="stat bg-emerald-50 text-emerald-700"><b class="text-2xl">${present}</b><small class="block">Present</small></div><div class="stat bg-red-50 text-red-700"><b class="text-2xl">${absent}</b><small class="block">Absent</small></div><div class="stat bg-amber-50 text-amber-700"><b class="text-2xl">${leave}</b><small class="block">Leave</small></div></div><div class="card mt-3"><p class="font-bold">Attendance rate: ${total ? Math.round(present / total * 100) : 0}%</p><div class="mt-3 space-y-2">${rows.map(row => `<div class="flex justify-between border-b pb-2 text-sm"><span>${esc(row.date)}</span><b class="capitalize">${esc(row.status)}</b></div>`).join('') || '<p class="text-sm text-slate-400">No attendance records yet.</p>'}</div></div>`; } catch (error) { console.error(error); $('attendance').innerHTML = empty('Attendance records are unavailable right now.'); } }
    async function renderProgress() { try { const [tasks, tracking, syllabus] = await Promise.all([getDocs(ref('task_evaluations')), getDocs(ref('daily_tracking')), getDocs(ref('syllabus_tracking'))]); let completed=0, participation=0; tasks.forEach(item => { const record=item.data(); if(record.classId === state.classInfo.id) Object.values(record.records?.[state.student.id] || {}).forEach(value => { if(value) completed++; }); }); tracking.forEach(item => { const record=item.data(); if(record.classId === state.classInfo.id && record.students?.[state.student.id] === 'asked') participation++; }); const currentProgress = syllabus.docs.map(item => item.data()).find(item => item.classId === state.classInfo.id); const completedSubjects = Object.values(currentProgress?.completed || {}).filter(Boolean).length; $('progress').innerHTML = `<h2 class="mb-3 text-xl font-bold">My progress</h2><div class="grid grid-cols-2 gap-3"><div class="stat bg-amber-50 text-amber-700"><b class="text-3xl">${completed}</b><small class="block">Tasks completed</small></div><div class="stat bg-indigo-50 text-indigo-700"><b class="text-3xl">${participation}</b><small class="block">Participation days</small></div></div><div class="card mt-3"><h3 class="font-bold">Learning plan</h3><p class="mt-2 text-sm text-slate-500">${completedSubjects} subject${completedSubjects === 1 ? '' : 's'} marked complete in the latest class update.</p><div class="mt-3">${(state.classInfo.subjects || []).map(subject => `<span class="mb-1 mr-1 inline-block rounded-full bg-violet-50 px-3 py-1 text-xs font-bold text-violet-700">${esc(subject)}</span>`).join('') || '<span class="text-sm text-slate-400">No subjects have been configured.</span>'}</div></div>`; } catch (error) { console.error(error); $('progress').innerHTML = empty('Progress information is unavailable right now.'); } }
    async function renderNotices() { try { const snapshot = await getDocs(ref('announcements')); const notices = snapshot.docs.map(item => item.data()); $('notices').innerHTML = `<h2 class="mb-3 text-xl font-bold">Notices</h2><div class="space-y-3">${notices.map(notice => `<article class="card"><h3 class="font-bold">${esc(notice.title)}</h3><p class="mt-2 text-sm leading-6 text-slate-600">${esc(notice.body)}</p></article>`).join('') || empty('No notices have been posted yet.')}</div>`; } catch (error) { console.error(error); $('notices').innerHTML = empty('Notices are unavailable right now.'); } }
    init();
  </script>
</body>
</html>
