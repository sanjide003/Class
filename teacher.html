<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher — Class App</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f8fafc}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px}.btn{border-radius:10px;padding:10px 14px;font-weight:700;background:#2563eb;color:#fff}</style></head><body class="text-slate-800"><main class="max-w-3xl mx-auto p-4"><header class="mb-6"><p class="text-xs font-bold text-blue-700">TEACHER PAGE</p><h1 class="text-2xl font-extrabold">Daily Attendance</h1><p class="text-sm text-slate-500">Build mode — login ഇല്ല</p></header><section class="card"><div class="grid sm:grid-cols-3 gap-2"><select id="class" class="field"></select><input id="date" class="field" type="date"><button id="load" class="btn">Load Students</button></div></section><section id="students" class="mt-4 space-y-2"></section><button id="save" class="btn mt-4 hidden">Attendance Save</button><p id="notice" class="text-sm font-bold text-blue-700 mt-3"></p><p class="text-xs text-slate-400 mt-5">Admin page: <b>admin.html</b> · Student page: <b>student.html</b></p></main><script type="module">import{db}from'./firebase-config.js';import{collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let students=[];$('date').value=new Date().toISOString().slice(0,10);async function init(){let q=await getDocs(collection(db,'classes'));$('class').innerHTML='<option value="">Class തിരഞ്ഞെടുക്കുക</option>'+q.docs.map(x=>`<option value="${x.id}">${esc(x.data().name)}</option>`).join('')}async function load(){let classId=$('class').value,date=$('date').value;if(!classId)return;let q=await getDocs(collection(db,'students'));students=q.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.classId===classId);let old=await getDoc(doc(db,'attendance',`${classId}_${date}`)),records=old.exists()?old.data().records||{}:{};$('students').innerHTML=students.map(s=>`<article class="card flex gap-2 items-center"><div class="flex-1 font-bold">${esc(s.rollNo)}. ${esc(s.name)}</div><select class="field w-32 status" data-id="${s.id}"><option value="present" ${records[s.id]?.status==='present'?'selected':''}>Present</option><option value="absent" ${records[s.id]?.status==='absent'?'selected':''}>Absent</option><option value="leave" ${records[s.id]?.status==='leave'?'selected':''}>Leave</option><option value="late" ${records[s.id]?.status==='late'?'selected':''}>Late</option></select></article>`).join('')||'<div class="card">No students</div>';$('save').classList.toggle('hidden',!students.length)}$('load').onclick=load;$('save').onclick=async()=>{let classId=$('class').value,date=$('date').value,records={};document.querySelectorAll('.status').forEach(x=>records[x.dataset.id]={status:x.value});await setDoc(doc(db,'attendance',`${classId}_${date}`),{classId,date,records,updatedAt:serverTimestamp()});$('notice').textContent='Attendance saved ചെയ്തു.'};init();</script></body></html>
