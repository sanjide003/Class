<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noorun Ala Noor — Class Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,'Noto Sans Malayalam',sans-serif;background:#f8fafc;color:#172033}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;padding:1rem;box-shadow:0 1px 2px #0f172a0d}.btn{border-radius:.75rem;padding:.7rem .9rem;font-weight:700;font-size:.875rem}.btn-primary{background:#0f766e;color:white}.btn-dark{background:#172033;color:white}.btn-danger{background:#dc2626;color:white}.btn-light{background:#f1f5f9;color:#334155}.field{width:100%;border:1px solid #cbd5e1;border-radius:.7rem;padding:.7rem;background:white}.label{display:block;font-size:.73rem;font-weight:700;color:#475569;margin:.55rem 0 .25rem}.nav-btn{display:block;width:100%;text-align:left;padding:.8rem;border-radius:.7rem;font-weight:600;color:#334155}.nav-btn.active,.nav-btn:hover{background:#ccfbf1;color:#115e59}.pill{font-size:.7rem;font-weight:700;border-radius:99px;padding:.2rem .55rem;background:#e2e8f0}.hide{display:none!important}</style>
</head>
<body>
<div id="toast" class="hide fixed z-50 top-4 left-4 right-4 max-w-md mx-auto p-4 rounded-xl text-sm font-semibold shadow-xl"></div>
<div id="loading" class="fixed inset-0 z-50 bg-slate-950/35 flex items-center justify-center"><div class="bg-white rounded-2xl p-5 font-bold shadow-xl">Loading…</div></div>

<section id="auth-shell" class="min-h-screen max-w-md mx-auto px-5 py-10 flex items-center">
 <div class="w-full"><div class="text-center mb-8"><div class="mx-auto w-16 h-16 rounded-2xl bg-teal-700 text-white grid place-items-center text-2xl font-black">നൂ</div><h1 class="text-2xl font-extrabold mt-4">Noorun Ala Noor</h1><p class="text-slate-500 text-sm mt-1">Class Management System</p></div>
 <div class="card"><div class="flex gap-2 mb-5"><button class="btn btn-primary flex-1" id="login-tab">ലോഗിൻ</button><button class="btn btn-light flex-1" id="signup-tab">അക്കൗണ്ട് അപേക്ഷ</button></div>
 <form id="login-form"><label class="label">ഇമെയിൽ</label><input class="field" type="email" id="login-email" required autocomplete="email"><label class="label">പാസ്‌വേഡ്</label><input class="field" type="password" id="login-password" required autocomplete="current-password"><button class="btn btn-primary w-full mt-5">ലോഗിൻ ചെയ്യുക</button><button type="button" id="reset-password" class="w-full text-teal-700 text-sm font-bold mt-4">പാസ്‌വേഡ് മറന്നോ?</button></form>
 <form id="signup-form" class="hide"><p class="text-sm text-slate-500 mb-3">അക്കൗണ്ട് ഉണ്ടാക്കിയാൽ Admin അംഗീകരിച്ചശേഷം മാത്രം പ്രവേശനം ലഭിക്കും.</p><label class="label">പൂർണ്ണ പേര്</label><input class="field" id="signup-name" required><label class="label">ഇമെയിൽ</label><input class="field" type="email" id="signup-email" required><label class="label">പാസ്‌വേഡ് (കുറഞ്ഞത് 6 അക്ഷരങ്ങൾ)</label><input class="field" type="password" id="signup-password" minlength="6" required><label class="label">അക്കൗണ്ട് തരം</label><select class="field" id="signup-type"><option value="teacher">Teacher</option><option value="student">Student / Parent</option></select><button class="btn btn-primary w-full mt-5">അക്കൗണ്ട് അപേക്ഷിക്കുക</button></form></div></div>
</section>

<section id="pending-shell" class="hide min-h-screen max-w-md mx-auto px-5 py-16 text-center"><div class="card"><div class="text-4xl">⏳</div><h1 class="font-extrabold text-xl mt-4">അക്കൗണ്ട് അംഗീകാരത്തിനായി കാത്തിരിക്കുന്നു</h1><p class="text-slate-500 text-sm mt-3">Admin നിങ്ങളുടെ role, class, profile എന്നിവ അനുവദിച്ചാൽ ഇവിടെ പ്രവേശിക്കാം.</p><button id="pending-logout" class="btn btn-light mt-6">ലോഗൗട്ട്</button></div></section>

<section id="app-shell" class="hide min-h-screen"><header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"><div><h1 id="institution-name" class="font-extrabold">Class Manager</h1><p id="header-role" class="text-xs text-slate-500"></p></div><div class="flex gap-2"><button id="menu-toggle" class="btn btn-light md:hidden">മെനു</button><button id="logout" class="btn btn-light">ലോഗൗട്ട്</button></div></div></header>
<div class="max-w-6xl mx-auto md:grid md:grid-cols-[220px_1fr] gap-6 px-4 py-5"><aside id="sidebar" class="hide md:block"><nav id="nav" class="card space-y-1"></nav></aside><main class="min-w-0"><div id="dashboard" class="view"></div><div id="attendance" class="view"></div><div id="students" class="view"></div><div id="classes" class="view"></div><div id="users" class="view"></div><div id="tasks" class="view"></div><div id="syllabus" class="view"></div><div id="reports" class="view"></div><div id="announcements" class="view"></div><div id="profile" class="view"></div></main></div></section>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,getDocs,query,where,orderBy,serverTimestamp,updateDoc,deleteDoc,writeBatch} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAfJSonmGHnf0t92B71ycuAZbc-CV3k7LE',authDomain:'fest-dsd-003.firebaseapp.com',projectId:'fest-dsd-003',storageBucket:'fest-dsd-003.firebasestorage.app',messagingSenderId:'409596394273',appId:'1:409596394273:web:b930012ce0a845ddb45c60'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const S={user:null,profile:null,inst:null,classes:[],students:[],view:'dashboard'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const iid=()=>S.profile?.institutionId; const root=()=>`institutions/${iid()}`; const col=n=>collection(db,root(),n); const d=(n,id)=>doc(db,root(),n,id);
function toast(msg,type='ok'){const e=$('toast');e.textContent=msg;e.className=`fixed z-50 top-4 left-4 right-4 max-w-md mx-auto p-4 rounded-xl text-sm font-semibold shadow-xl ${type==='error'?'bg-red-600 text-white':'bg-teal-700 text-white'}`;setTimeout(()=>e.className='hide',4200)}
function busy(v){$('loading').classList.toggle('hide',!v)}
async function audit(action,target,details={}){try{await addDoc(col('auditLogs'),{action,target,details,actorId:S.user.uid,actorName:S.profile.displayName||S.user.email,createdAt:serverTimestamp()})}catch(e){console.warn(e)}}
function canAdmin(){return ['super_admin','admin'].includes(S.profile?.role)} function isTeacher(){return S.profile?.role==='teacher'} function allowedClass(id){return canAdmin()||(S.profile.assignedClassIds||[]).includes(id)}
function tab(signup){$('login-form').classList.toggle('hide',signup);$('signup-form').classList.toggle('hide',!signup);$('login-tab').className='btn '+(!signup?'btn-primary':'btn-light')+' flex-1';$('signup-tab').className='btn '+(signup?'btn-primary':'btn-light')+' flex-1'}
$('login-tab').onclick=()=>tab(false);$('signup-tab').onclick=()=>tab(true);
$('login-form').onsubmit=async e=>{e.preventDefault();busy(true);try{await signInWithEmailAndPassword(auth,$('login-email').value.trim(),$('login-password').value)}catch(e){toast('ലോഗിൻ പരാജയപ്പെട്ടു: '+e.message,'error')}finally{busy(false)}};
$('signup-form').onsubmit=async e=>{e.preventDefault();busy(true);try{let email=$('signup-email').value.trim(),name=$('signup-name').value.trim(),role=$('signup-type').value;let r=await createUserWithEmailAndPassword(auth,email,$('signup-password').value);await updateProfile(r.user,{displayName:name});await setDoc(doc(db,'users',r.user.uid),{displayName:name,email,requestedRole:role,role:'pending',status:'pending',createdAt:serverTimestamp()});toast('അപേക്ഷ അയച്ചു. Admin അംഗീകാരത്തിനായി കാത്തിരിക്കുക.')}catch(e){toast('അക്കൗണ്ട് സൃഷ്ടിക്കാനായില്ല: '+e.message,'error')}finally{busy(false)}};
$('reset-password').onclick=async()=>{let e=$('login-email').value.trim();if(!e)return toast('ആദ്യം ഇമെയിൽ നൽകുക','error');try{await sendPasswordResetEmail(auth,e);toast('Password reset email അയച്ചു.')}catch(x){toast(x.message,'error')}};
$('logout').onclick=$('pending-logout').onclick=()=>signOut(auth);
async function getProfile(user){let p=await getDoc(doc(db,'users',user.uid));if(p.exists())return {id:p.id,...p.data()}; // legacy migration: accepts old role profile
let old=await getDoc(doc(db,'madrasa','public','data','users',user.uid));if(old.exists()){let x=old.data();await setDoc(doc(db,'users',user.uid),{...x,email:user.email,displayName:x.displayName||user.displayName||user.email,status:'active',migratedAt:serverTimestamp()});return {id:user.uid,...x,status:'active'}}return null}
onAuthStateChanged(auth,async user=>{busy(true);try{S.user=user;if(!user){$('auth-shell').classList.remove('hide');$('pending-shell').classList.add('hide');$('app-shell').classList.add('hide');return}S.profile=await getProfile(user);if(!S.profile||S.profile.status!=='active'||!S.profile.institutionId||!['super_admin','admin','teacher','student'].includes(S.profile.role)){$('auth-shell').classList.add('hide');$('app-shell').classList.add('hide');$('pending-shell').classList.remove('hide');return}await boot()}catch(e){console.error(e);toast('ഡാറ്റ load ചെയ്യാനായില്ല. Firestore rules പരിശോധിക്കുക.','error')}finally{busy(false)}});
async function boot(){let i=await getDoc(doc(db,'institutions',iid()));if(!i.exists()&&canAdmin()){await setDoc(doc(db,'institutions',iid()),{name:'Noorun Ala Noor',createdAt:serverTimestamp(),createdBy:S.user.uid});i=await getDoc(doc(db,'institutions',iid()))}S.inst=i.exists()?i.data():{name:'Class Manager'};$('institution-name').textContent=S.inst.name||'Class Manager';$('header-role').textContent=`${S.profile.displayName||S.user.email} • ${S.profile.role.replace('_',' ')}`;$('auth-shell').classList.add('hide');$('pending-shell').classList.add('hide');$('app-shell').classList.remove('hide');await loadBasics();buildNav();go('dashboard')}
async function loadBasics(){
 let x=await getDocs(query(col('classes'),orderBy('name'))); S.classes=x.docs.map(z=>({id:z.id,...z.data()}));
 let snaps;
 if(canAdmin()) snaps=[await getDocs(col('students'))];
 else if(S.profile.role==='student') snaps=[await getDocs(query(col('students'),where('linkedUserId','==',S.user.uid)))];
 else snaps=await Promise.all((S.profile.assignedClassIds||[]).map(classId=>getDocs(query(col('students'),where('classId','==',classId)))));
 S.students=snaps.flatMap(snap=>snap.docs.map(z=>({id:z.id,...z.data()})));
}
const nav=[['dashboard','ഡാഷ്ബോർഡ്'],['attendance','ഹാജർ'],['students','വിദ്യാർത്ഥികൾ'],['classes','Classes'],['users','User Approval'],['tasks','Tasks'],['syllabus','Syllabus'],['reports','Reports'],['announcements','Announcements'],['profile','My Profile']];
function buildNav(){$('nav').innerHTML=nav.filter(([id])=>!(S.profile.role==='student'&&['attendance','students','classes','users','tasks','syllabus'].includes(id))&&!(isTeacher()&&['classes','users'].includes(id))).map(([id,n])=>`<button class="nav-btn" data-go="${id}">${n}</button>`).join('');$('nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
$('menu-toggle').onclick=()=>$('sidebar').classList.toggle('hide');
function go(v){S.view=v;document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('[data-go]').forEach(e=>e.classList.toggle('active',e.dataset.go===v));$('sidebar').classList.add('hide');({dashboard,attendance,students,classes,users,tasks,syllabus,reports,announcements,profile})[v]()}
function classOptions(selected=''){return S.classes.filter(x=>canAdmin()||allowedClass(x.id)).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function dashboard(){let mine=S.profile.role==='student'?S.students.find(x=>x.linkedUserId===S.user.uid):null;$('dashboard').innerHTML=`<h2 class="text-2xl font-extrabold mb-1">സ്വാഗതം, ${esc(S.profile.displayName||'')}</h2><p class="text-slate-500 mb-5">${new Date().toLocaleDateString('en-IN',{dateStyle:'full'})}</p><div class="grid sm:grid-cols-3 gap-3"><div class="card"><p class="text-xs font-bold text-slate-500">നിങ്ങളുടെ ROLE</p><p class="text-xl font-extrabold mt-2">${esc(S.profile.role)}</p></div><div class="card"><p class="text-xs font-bold text-slate-500">ലഭ്യമായ ക്ലാസുകൾ</p><p class="text-xl font-extrabold mt-2">${canAdmin()?S.classes.length:(S.profile.assignedClassIds||[]).length}</p></div><div class="card"><p class="text-xs font-bold text-slate-500">വിദ്യാർത്ഥികൾ</p><p class="text-xl font-extrabold mt-2">${mine?esc(mine.fullName):S.students.length}</p></div></div><div class="card mt-5"><h3 class="font-bold">ഇന്നത്തെ പ്രവർത്തനം</h3><p class="text-sm text-slate-500 mt-2">${S.profile.role==='student'?'നിങ്ങളുടെ attendance, report, announcements ഇവിടെ ലഭിക്കും.':'ഹാജർ mark ചെയ്യാനും വിദ്യാർത്ഥികളുടെ പുരോഗതി രേഖപ്പെടുത്താനും menu ഉപയോഗിക്കുക.'}</p></div>`}
function attendance(){if(S.profile.role==='student'){return studentAttendance()}let today=new Date().toISOString().slice(0,10);$('attendance').innerHTML=`<h2 class="text-2xl font-extrabold">Daily Attendance</h2><div class="card mt-4 grid sm:grid-cols-3 gap-3"><div><label class="label">Class</label><select id="att-class" class="field">${classOptions()}</select></div><div><label class="label">Date</label><input id="att-date" class="field" type="date" value="${today}"></div><div class="flex items-end"><button id="att-load" class="btn btn-dark w-full">Load</button></div></div><div id="att-list" class="mt-4"></div>`;$('att-load').onclick=loadAttendance}
async function loadAttendance(){let cid=$('att-class').value,date=$('att-date').value;if(!cid||!date)return;busy(true);try{let snap=await getDoc(d('attendance',`${cid}_${date}`));let records=snap.exists()?snap.data().records||{}:{};let list=S.students.filter(s=>s.classId===cid);$('att-list').innerHTML=`<div class="flex gap-2 mb-3"><button class="btn btn-light" id="all-present">എല്ലാവരും Present</button><button class="btn btn-primary" id="att-save">Save Attendance</button></div><div class="space-y-2">${list.map(s=>`<div class="card p-3 flex gap-2 items-center"><div class="flex-1 font-bold">${esc(s.fullName)} <span class="pill">${esc(s.rollNo||'')}</span></div><select class="field w-28 att-status" data-id="${s.id}"><option ${records[s.id]?.status==='present'?'selected':''} value="present">Present</option><option ${records[s.id]?.status==='absent'?'selected':''} value="absent">Absent</option><option ${records[s.id]?.status==='leave'?'selected':''} value="leave">Leave</option><option ${records[s.id]?.status==='late'?'selected':''} value="late">Late</option></select><input class="field w-32 att-note" data-id="${s.id}" placeholder="Note" value="${esc(records[s.id]?.note||'')}"></div>`).join('')}</div>`;$('all-present').onclick=()=>document.querySelectorAll('.att-status').forEach(x=>x.value='present');$('att-save').onclick=()=>saveAttendance(cid,date)}catch(e){toast(e.message,'error')}finally{busy(false)}}
async function saveAttendance(cid,date){let records={};document.querySelectorAll('.att-status').forEach(x=>records[x.dataset.id]={status:x.value,note:document.querySelector(`.att-note[data-id="${x.dataset.id}"]`).value});busy(true);try{let batch=writeBatch(db);batch.set(d('attendance',`${cid}_${date}`),{classId:cid,date,records,submittedBy:S.user.uid,updatedBy:S.user.uid,updatedAt:serverTimestamp(),locked:false},{merge:true});Object.entries(records).forEach(([studentId,record])=>batch.set(d('studentAttendance',`${cid}_${date}_${studentId}`),{classId:cid,date,studentId,...record,updatedBy:S.user.uid,updatedAt:serverTimestamp()},{merge:true}));await batch.commit();await audit('attendance_saved',`${cid}_${date}`,{count:Object.keys(records).length});toast('Attendance saved ചെയ്തു.')}catch(e){toast(e.message,'error')}finally{busy(false)}}
async function studentAttendance(){let st=S.students.find(x=>x.linkedUserId===S.user.uid);if(!st){$('attendance').innerHTML='<div class="card">നിങ്ങളുടെ student profile Admin link ചെയ്തിട്ടില്ല.</div>';return}let all=await getDocs(query(col('studentAttendance'),where('studentId','==',st.id)));let a=0,p=0,ab=0,l=0;all.forEach(x=>{let r=x.data();a++;if(r.status==='present'||r.status==='late')p++;if(r.status==='absent')ab++;else if(r.status==='leave')l++});$('attendance').innerHTML=`<h2 class="text-2xl font-extrabold">എന്റെ ഹാജർ</h2><div class="grid grid-cols-2 gap-3 mt-4"><div class="card"><p class="text-xs text-slate-500">Attendance %</p><p class="text-2xl font-extrabold">${a?Math.round(p/a*100):0}%</p></div><div class="card"><p class="text-xs text-slate-500">Recorded days</p><p class="text-2xl font-extrabold">${a}</p></div><div class="card">Present: <b>${p}</b></div><div class="card">Absent: <b>${ab}</b> · Leave: <b>${l}</b></div></div>`}
function students(){if(S.profile.role==='student'){let s=S.students.find(x=>x.linkedUserId===S.user.uid);$('students').innerHTML=`<h2 class="text-2xl font-extrabold">എന്റെ Profile</h2><div class="card mt-4"><p class="font-bold">${esc(s?.fullName||'Profile pending')}</p><p class="text-sm text-slate-500 mt-2">Class: ${esc(S.classes.find(x=>x.id===s?.classId)?.name||'—')}</p><p class="text-sm text-slate-500">Admission No: ${esc(s?.admissionNo||'—')}</p></div>`;return}$('students').innerHTML=`<div class="flex justify-between items-center"><h2 class="text-2xl font-extrabold">വിദ്യാർത്ഥികൾ</h2>${canAdmin()?'<button id="add-student" class="btn btn-primary">+ Add Student</button>':''}</div><div id="student-form" class="hide card mt-4"><div class="grid sm:grid-cols-2 gap-2"><input id="st-name" class="field" placeholder="Full name"><input id="st-adm" class="field" placeholder="Admission no"><input id="st-roll" class="field" placeholder="Roll no"><select id="st-class" class="field">${classOptions()}</select></div><button id="save-student" class="btn btn-primary mt-3">Save Student</button></div><div class="card mt-4 overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500"><th class="p-2">Name</th><th>Class</th><th>Roll</th><th>Status</th></tr></thead><tbody>${S.students.map(s=>`<tr class="border-t"><td class="p-2 font-semibold">${esc(s.fullName)}</td><td>${esc(S.classes.find(x=>x.id===s.classId)?.name||'')}</td><td>${esc(s.rollNo||'')}</td><td>${esc(s.status||'active')}</td></tr>`).join('')||'<tr><td class="p-2" colspan="4">No students</td></tr>'}</tbody></table></div>`;if(canAdmin()){$('add-student').onclick=()=>$('student-form').classList.remove('hide');$('save-student').onclick=saveStudent}}
async function saveStudent(){let fullName=$('st-name').value.trim(),classId=$('st-class').value;if(!fullName||!classId)return toast('Name and class required','error');try{let r=await addDoc(col('students'),{fullName,classId,admissionNo:$('st-adm').value.trim(),rollNo:$('st-roll').value.trim(),status:'active',createdAt:serverTimestamp(),createdBy:S.user.uid});await audit('student_created',r.id);await loadBasics();students();toast('Student ചേർത്തു.')}catch(e){toast(e.message,'error')}}
function classes(){if(!canAdmin())return;$('classes').innerHTML=`<div class="flex justify-between"><h2 class="text-2xl font-extrabold">Classes</h2><button id="new-class" class="btn btn-primary">+ Add Class</button></div><div id="class-form" class="hide card mt-4"><input id="class-name" class="field" placeholder="e.g. Class 5 A"><input id="class-subjects" class="field mt-2" placeholder="Subjects, comma separated"><button id="save-class" class="btn btn-primary mt-3">Save Class</button></div><div class="grid sm:grid-cols-2 gap-3 mt-4">${S.classes.map(c=>`<div class="card"><b>${esc(c.name)}</b><p class="text-sm text-slate-500 mt-1">${esc((c.subjects||[]).join(', ')||'No subjects')}</p></div>`).join('')}</div>`;$('new-class').onclick=()=>$('class-form').classList.remove('hide');$('save-class').onclick=async()=>{let name=$('class-name').value.trim();if(!name)return;try{let r=await addDoc(col('classes'),{name,subjects:$('class-subjects').value.split(',').map(x=>x.trim()).filter(Boolean),createdAt:serverTimestamp()});await audit('class_created',r.id);await loadBasics();classes();toast('Class saved.')}catch(e){toast(e.message,'error')}}}
async function users(){if(!canAdmin())return;busy(true);try{let x=await getDocs(collection(db,'users'));let us=x.docs.map(z=>({id:z.id,...z.data()}));$('users').innerHTML=`<h2 class="text-2xl font-extrabold">User Approval</h2><p class="text-slate-500 text-sm mt-1">Pending users approve ചെയ്ത് role, class അനുവദിക്കുക.</p><div class="space-y-3 mt-4">${us.map(u=>`<div class="card"><div class="flex justify-between gap-2"><div><b>${esc(u.displayName||u.email)}</b><p class="text-xs text-slate-500">${esc(u.email||'')} · ${esc(u.status||'pending')}</p></div><span class="pill">${esc(u.role||u.requestedRole||'pending')}</span></div>${u.status!=='active'?`<div class="grid sm:grid-cols-3 gap-2 mt-3"><select class="field user-role" data-id="${u.id}"><option value="teacher" ${u.requestedRole==='teacher'?'selected':''}>Teacher</option><option value="student" ${u.requestedRole==='student'?'selected':''}>Student</option><option value="admin">Admin</option></select><select class="field user-class" data-id="${u.id}"><option value="">No class</option>${classOptions()}</select><button class="btn btn-primary approve" data-id="${u.id}">Approve</button></div>`:''}</div>`).join('')||'<div class="card">No users</div>'}</div>`;document.querySelectorAll('.approve').forEach(b=>b.onclick=()=>approve(b.dataset.id,us.find(u=>u.id===b.dataset.id)))}catch(e){toast(e.message,'error')}finally{busy(false)}}
async function approve(uid,u){let role=document.querySelector(`.user-role[data-id="${uid}"]`).value,classId=document.querySelector(`.user-class[data-id="${uid}"]`).value;let p={role,status:'active',institutionId:iid(),approvedBy:S.user.uid,approvedAt:serverTimestamp(),assignedClassIds:role==='teacher'&&classId?[classId]:[]};try{await updateDoc(doc(db,'users',uid),p);if(role==='student'&&classId){let st=S.students.find(x=>x.fullName?.toLowerCase()===u.displayName?.toLowerCase()&&x.classId===classId);if(st)await updateDoc(d('students',st.id),{linkedUserId:uid})}await audit('user_approved',uid,{role,classId});toast('User approved ചെയ്തു.');users()}catch(e){toast(e.message,'error')}}
async function tasks(){let mine=S.profile.role==='student';let x=await getDocs(col('tasks'));let list=x.docs.map(z=>({id:z.id,...z.data()})).filter(t=>mine||allowedClass(t.classId));$('tasks').innerHTML=`<div class="flex justify-between"><h2 class="text-2xl font-extrabold">Tasks</h2>${!mine?'<button id="new-task" class="btn btn-primary">+ Task</button>':''}</div><div id="task-form" class="hide card mt-4"><input id="task-title" class="field" placeholder="Task name"><input id="task-points" class="field mt-2" type="number" value="5"><select id="task-class" class="field mt-2">${classOptions()}</select><button id="save-task" class="btn btn-primary mt-3">Save</button></div><div class="space-y-2 mt-4">${list.map(t=>`<div class="card"><b>${esc(t.title)}</b><span class="pill ml-2">${esc(t.points)} points</span></div>`).join('')||'<div class="card">No tasks</div>'}</div>`;if(!mine){$('new-task').onclick=()=>$('task-form').classList.remove('hide');$('save-task').onclick=async()=>{try{let r=await addDoc(col('tasks'),{title:$('task-title').value.trim(),points:Number($('task-points').value||0),classId:$('task-class').value,createdBy:S.user.uid,createdAt:serverTimestamp()});await audit('task_created',r.id);toast('Task saved.');tasks()}catch(e){toast(e.message,'error')}}}}
async function syllabus(){let cs=S.classes.filter(c=>canAdmin()||allowedClass(c.id));$('syllabus').innerHTML=`<h2 class="text-2xl font-extrabold">Syllabus Progress</h2><div class="card mt-4"><select id="sy-class" class="field">${classOptions()}</select><input id="sy-month" class="field mt-2" type="month" value="${new Date().toISOString().slice(0,7)}"><button id="sy-load" class="btn btn-dark mt-2">Load</button></div><div id="sy-list" class="mt-4"></div>`;$('sy-load').onclick=async()=>{let c=S.classes.find(x=>x.id===$('sy-class').value),month=$('sy-month').value,snap=await getDoc(d('syllabus',`${c.id}_${month}`)),data=snap.exists()?snap.data().completed||{}:{};$('sy-list').innerHTML=`<div class="card space-y-2">${(c.subjects||[]).map(s=>`<label class="block"><span class="label">${esc(s)} — completed lesson</span><input class="field sy-val" data-subject="${esc(s)}" type="number" value="${esc(data[s]||0)}"></label>`).join('')}<button id="sy-save" class="btn btn-primary">Save Progress</button></div>`;$('sy-save').onclick=async()=>{let completed={};document.querySelectorAll('.sy-val').forEach(e=>completed[e.dataset.subject]=Number(e.value||0));try{await setDoc(d('syllabus',`${c.id}_${month}`),{classId:c.id,month,completed,updatedBy:S.user.uid,updatedAt:serverTimestamp()});toast('Syllabus progress saved.')}catch(e){toast(e.message,'error')}}}}
async function reports(){let student=S.profile.role==='student'?S.students.find(x=>x.linkedUserId===S.user.uid):null;$('reports').innerHTML=`<h2 class="text-2xl font-extrabold">Reports</h2>${student?'':`<div class="card mt-4"><select id="rep-student" class="field"><option value="">Select student</option>${S.students.map(s=>`<option value="${s.id}">${esc(s.fullName)}</option>`).join('')}</select><button id="rep-load" class="btn btn-dark mt-2">Generate Report</button></div>`}<div id="rep-result" class="mt-4"></div>`;if(student)reportFor(student.id);else $('rep-load').onclick=()=>reportFor($('rep-student').value)}
async function reportFor(sid){if(!sid)return;busy(true);try{let st=S.students.find(s=>s.id===sid),at=await getDocs(query(col('attendance'),where('classId','==',st.classId)));let total=0,present=0,absent=0,leave=0;at.forEach(x=>{let r=x.data().records?.[sid];if(r){total++;if(['present','late'].includes(r.status))present++;else if(r.status==='absent')absent++;else leave++}});$('rep-result').innerHTML=`<div class="card"><h3 class="font-extrabold">${esc(st.fullName)}</h3><div class="grid grid-cols-2 gap-3 mt-4"><div class="p-3 bg-teal-50 rounded-xl">Attendance<br><b class="text-2xl">${total?Math.round(present/total*100):0}%</b></div><div class="p-3 bg-slate-100 rounded-xl">Recorded days<br><b class="text-2xl">${total}</b></div><div class="p-3 bg-red-50 rounded-xl">Absent<br><b class="text-2xl">${absent}</b></div><div class="p-3 bg-amber-50 rounded-xl">Leave<br><b class="text-2xl">${leave}</b></div></div></div>`}catch(e){toast(e.message,'error')}finally{busy(false)}}
async function announcements(){let x=await getDocs(query(col('announcements'),orderBy('createdAt','desc')));let a=x.docs.map(z=>({id:z.id,...z.data()}));$('announcements').innerHTML=`<div class="flex justify-between"><h2 class="text-2xl font-extrabold">Announcements</h2>${canAdmin()?'<button id="new-ann" class="btn btn-primary">+ New</button>':''}</div><div id="ann-form" class="hide card mt-4"><input id="ann-title" class="field" placeholder="Title"><textarea id="ann-body" class="field mt-2" placeholder="Message"></textarea><button id="ann-save" class="btn btn-primary mt-2">Publish</button></div><div class="space-y-3 mt-4">${a.map(n=>`<article class="card"><h3 class="font-bold">${esc(n.title)}</h3><p class="text-sm text-slate-600 mt-2 whitespace-pre-wrap">${esc(n.body)}</p></article>`).join('')||'<div class="card">No announcements</div>'}</div>`;if(canAdmin()){$('new-ann').onclick=()=>$('ann-form').classList.remove('hide');$('ann-save').onclick=async()=>{try{let r=await addDoc(col('announcements'),{title:$('ann-title').value.trim(),body:$('ann-body').value.trim(),createdBy:S.user.uid,createdAt:serverTimestamp()});await audit('announcement_created',r.id);toast('Announcement published.');announcements()}catch(e){toast(e.message,'error')}}}}
function profile(){$('profile').innerHTML=`<h2 class="text-2xl font-extrabold">My Profile</h2><div class="card mt-4"><p class="font-bold">${esc(S.profile.displayName||'')}</p><p class="text-sm text-slate-500 mt-1">${esc(S.user.email)}</p><p class="mt-3"><span class="pill">${esc(S.profile.role)}</span></p><p class="text-xs text-slate-500 mt-5">Password മാറ്റാൻ login screen-ലെ “പാസ്‌വേഡ് മറന്നോ?” ഉപയോഗിക്കുക.</p></div>`}
</script></body></html>
